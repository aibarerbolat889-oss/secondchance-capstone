name: SecondChance CI
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint backend and scripts
        run: npm run lint
      - name: Run MongoDB integration tests
        run: npm test
      - name: Build React frontend
        run: npm run build
      - name: Build application container
        run: docker build -t secondchance:${{ github.sha }} .
      - name: Save frontend build
        uses: actions/upload-artifact@v4
        with:
          name: secondchance-frontend
          path: secondChance-frontend/dist
